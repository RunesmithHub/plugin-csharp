# Builds, checks formatting and runs the tests on Linux and Windows, then checks the plugin as the hub does when it publishes a release.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test on ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Linux
            os: linux
            runner: ubuntu-24.04
          - system: Windows
            os: windows
            runner: windows-2025
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build plugin-csharp.slnx -warnaserror

      - name: Check formatting
        run: dotnet format plugin-csharp.slnx --verify-no-changes --no-restore

      - name: Test
        run: >-
          dotnet test --solution plugin-csharp.slnx --no-build --results-directory TestResults --
          --report-xunit-trx --hangdump --hangdump-timeout 10m --hangdump-type Mini

      - name: Upload the test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 14
          if-no-files-found: ignore

  hub-check:
    name: Hub check
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Install the hub tool
        # The repository's NuGet configuration maps RunesmithHub.* to the hub feed; --add-source cannot be combined with that mapping.
        run: dotnet tool install RunesmithHub.Tool --version 0.1.2 --tool-path "$RUNNER_TEMP/rshub"

      - name: Check the plugin as the hub does
        run: '"$RUNNER_TEMP/rshub/rshub" check .'
